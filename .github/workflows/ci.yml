name: Decisions CI
on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decisions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - name: Instalar dependências do lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Conferir links locais
        run: node scripts/check-doc-links.mjs
      - name: Conferir tipos
        run: npm run typecheck
      - name: Executar testes
        run: npm test
      - name: Gerar build de produção
        run: npm run build
      - name: Conferir origem local no next start
        run: node --test tests/live-origin.mjs
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: Validar roteiros HTML offline
        run: node --test tests/demo-scripts.mjs
      - name: Verificar interação e capturar telas
        run: node scripts/verify-browser.mjs
      - name: Guardar telas da aplicação fictícia
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: decisions-ui-review
          retention-days: 7
          path: test-results
